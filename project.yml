name: CarStatus
options:
  bundleIdPrefix: com.mikemadden
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    VERSIONING_SYSTEM: apple-generic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: NO
    # The app and the widget share one keychain group, which holds the
    # sign-ins and the last status. Keychain sharing needs no App ID
    # capability, so nothing extra has to be registered with Apple.
    KEYCHAIN_GROUP: $(DEVELOPMENT_TEAM).com.mikemadden.carstatus.shared

targets:
  CarStatus:
    type: application
    platform: iOS
    sources:
      - CarStatus
      - Shared
    dependencies:
      - target: CarStatusWidget
        embed: true
    entitlements:
      path: CarStatus/CarStatus.entitlements
      properties:
        keychain-access-groups:
          - $(KEYCHAIN_GROUP)
    info:
      path: CarStatus/Info.plist
      properties:
        CFBundleDisplayName: Cars
        CFBundleName: Cars
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        KeychainGroup: $(KEYCHAIN_GROUP)
        NSAppTransportSecurity: &ats
          NSExceptionDomains:
            # Kia's US server only speaks TLS 1.2 with older ciphers.
            api.owners.kia.com:
              NSExceptionMinimumTLSVersion: TLSv1.2
              NSExceptionRequiresForwardSecrecy: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.$(DEVELOPMENT_TEAM).carstatus
        PRODUCT_NAME: CarStatus
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  CarStatusWidget:
    type: app-extension
    platform: iOS
    sources:
      - CarStatusWidget
      - Shared
    entitlements:
      path: CarStatusWidget/CarStatusWidget.entitlements
      properties:
        keychain-access-groups:
          - $(KEYCHAIN_GROUP)
    info:
      path: CarStatusWidget/Info.plist
      properties:
        CFBundleDisplayName: Cars
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        KeychainGroup: $(KEYCHAIN_GROUP)
        NSAppTransportSecurity: *ats
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.$(DEVELOPMENT_TEAM).carstatus.widget
        PRODUCT_NAME: CarStatusWidget
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
